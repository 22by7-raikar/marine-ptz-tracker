# Intended deployment values. Verify device paths and calibrated limits before use.
runtime:
  mode: hardware
  telemetry_enabled: true

camera:
  source: v4l2
  device: /dev/video0
  width: 1920
  height: 1080
  fps: 30

detection:
  backend: ultralytics
  model: yolo11n.pt
  device: auto
  confidence_threshold: 0.60
  iou_threshold: 0.45
  image_size: 640
  target_labels:
    - boat

serial:
  device: /dev/ttyACM0
  baudrate: 115200
  timeout_s: 0.25

actuator:
  backend: arduino_serial
  pan_limits_deg: [20.0, 160.0]
  tilt_limits_deg: [35.0, 145.0]
  initial_pan_deg: 90.0
  initial_tilt_deg: 90.0

tracking:
  deadband_px: 24.0
  proportional_gain: 8.0
  max_step_deg: 3.0
  update_rate_hz: 10.0
  lost_target_behavior: hold
