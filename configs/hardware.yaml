# Intended deployment values. Verify device paths and calibrated limits before use.
runtime:
  mode: hardware
  telemetry_enabled: true

camera:
  source: v4l2
  device: /dev/video0
  width: 1920
  height: 1080
  fps: 30

detection:
  backend: ultralytics
  model: yolo11n.pt
  device: auto
  confidence_threshold: 0.60
  iou_threshold: 0.45
  image_size: 640
  target_labels:
    - boat

serial:
  device: /dev/ttyACM0
  baudrate: 115200
  read_timeout_s: 0.25
  write_timeout_s: 0.25
  retries: 2
  command_rate_hz: 10.0
  watchdog_timeout_s: 1.0
  boot_grace_seconds: 2.0
  handshake_timeout_seconds: 4.0
  handshake_retry_interval_seconds: 0.25
  pan_direction: 1
  tilt_direction: 1
  pan_offset_deg: 0.0
  tilt_offset_deg: 0.0
  physical_pan_limits_deg: [20.0, 160.0]
  physical_tilt_limits_deg: [35.0, 145.0]
  neutral_pan_deg: 90.0
  neutral_tilt_deg: 90.0

actuator:
  backend: arduino_serial
  pan_limits_deg: [20.0, 160.0]
  tilt_limits_deg: [35.0, 145.0]
  initial_pan_deg: 90.0
  initial_tilt_deg: 90.0

tracking:
  deadband_px: 24.0
  proportional_gain: 8.0
  max_step_deg: 3.0
  update_rate_hz: 10.0
  lost_target_behavior: hold
