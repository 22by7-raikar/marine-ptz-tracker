name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.10"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
            constraints/vision-cu128.txt
      - name: Install base and development dependencies
        run: >-
          python -m pip install
          --constraint constraints/ci.txt
          --editable ".[dev]"
      - name: Compile source and tests
        run: python -m compileall -q src tests tools
      - name: Smoke check
        run: python tools/smoke_check.py
      - name: Hardware-free test suite
        run: python -m pytest -m "not hardware and not gpu"
      - name: Dependency consistency
        run: python -m pip check
