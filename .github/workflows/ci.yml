name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.10"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
            constraints/vision-cu128.txt
      - name: Install base and development dependencies
        run: |
          python -m pip install --constraint constraints/ci.txt setuptools
          python -m pip install \
            --no-build-isolation \
            --constraint constraints/ci.txt \
            --editable ".[dev]"
      - name: Ruff format check
        run: ruff format --check src tests tools
      - name: Ruff lint
        run: ruff check src tests tools
      - name: Compile source and tests
        run: python -m compileall -q src tests tools
      - name: Smoke check
        run: python tools/smoke_check.py
      - name: Complete test suite
        run: python -m pytest
      - name: Dependency consistency
        run: python -m pip check
      - name: Patch hygiene
        run: git diff --check

  container-test:
    name: CPU container test target
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build CPU-only test target
        run: docker compose --env-file /dev/null -f compose.yaml build test
      - name: Run CPU-only test target
        run: docker compose --env-file /dev/null -f compose.yaml run --rm test

  firmware:
    name: Firmware (Arduino Uno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # arduino/setup-arduino-cli v2.0.0, verified upstream commit
        with:
          version: "1.5.1"
      - name: Install pinned Arduino prerequisites
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib install Servo@1.3.0
      - name: Compile Uno firmware
        run: tools/compile_arduino.sh "${RUNNER_TEMP}/marine-ptz-arduino-build"
