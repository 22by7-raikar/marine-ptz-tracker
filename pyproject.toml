[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marine-ptz"
version = "0.1.0"
description = "Laptop-driven marine PTZ object-tracking system"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Marine PTZ contributors" }]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
marine-ptz-demo = "marine_ptz.demo:main"
marine-ptz-vision = "marine_ptz.vision_cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
vision = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "ultralytics==8.4.104",
    "opencv-python==5.0.0.93",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "unit: deterministic, hardware-free unit test (default for unmarked tests)",
    "integration: hardware-free integration test using fakes or synthetic components",
    "hardware: requires explicitly connected physical hardware",
    "gpu: requires an explicitly available CUDA-capable GPU",
]

[tool.ruff]
target-version = "py310"
line-length = 100
